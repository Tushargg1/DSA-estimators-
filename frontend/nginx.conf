# nginx config for the DSA Progress Tracker SPA (task 12.2).
#
# Responsibilities:
#   1. Serve the static Vite bundle.
#   2. SPA fallback: route unknown paths to index.html so client-side routing
#      works on deep links / refreshes.
#   3. Optional reverse proxy for /api and /ws to the backend. This is only used
#      when the frontend and backend are served from the same origin. If the
#      frontend instead talks to the backend directly (via VITE_API_BASE_URL /
#      VITE_WS_URL baked in at build time), the proxy blocks below are inert —
#      the browser calls the backend host directly and never hits these paths.
#
# The backend upstream host is configurable via the BACKEND_URL env var if you
# template this file (e.g. with `envsubst`); the static default assumes a
# service named "backend" on port 8080 (docker-compose / same network).

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache fingerprinted assets (Vite emits hashed filenames under /assets).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any route the static files don't match.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Optional same-origin backend proxy -------------------------------
    # REST API. Uncomment/keep when frontend + backend share this nginx origin.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket / SockJS endpoint — needs Upgrade headers for the raw WS handshake.
    location /ws/ {
        proxy_pass         http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
