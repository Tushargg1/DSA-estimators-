# =============================================================================
# DSA Progress Tracker — backend configuration
#
# Environment-specific values use ${ENV_VAR:local-default}; the same build runs
# locally with Compose and on Render/Aiven. See backend/.env.example.
#
# SECURITY: localhost defaults are development-only. Production must provide
# database credentials and explicit REST/WebSocket origins (never "*").
# =============================================================================

server:
  # Render injects PORT. SERVER_PORT remains a portable fallback for other hosts.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: backend

  # Local defaults target the MySQL 8 service in the root docker-compose.yml.
  # Aiven deployments must override all three DB_* variables and require TLS.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dsatracker?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:dsatracker}
    password: ${DB_PASSWORD:dsatracker}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Conservative defaults avoid exhausting small managed-service connection limits.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate verifies mappings without mutating it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cors:
  # Comma-separated REST origins for /api/**; set explicit production origins.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

websocket:
  # Comma-separated STOMP /ws handshake origins; set explicit production origins.
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
