# =============================================================================
# DSA Progress Tracker — backend configuration
#
# Environment-specific values use ${ENV_VAR:local-default}; the same build runs
# locally with Compose and on Render/Aiven. See backend/.env.example.
#
# SECURITY: localhost defaults are development-only. Production must provide
# database credentials and explicit REST/WebSocket origins (never "*").
# =============================================================================

server:
  # Render injects PORT. SERVER_PORT remains a portable fallback for other hosts.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: backend

  # Local defaults target the MySQL 8 service in the root docker-compose.yml.
  # Aiven deployments must override all three DB_* variables and require TLS.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dsatracker?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:dsatracker}
    password: ${DB_PASSWORD:dsatracker}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Conservative defaults avoid exhausting small managed-service connection limits.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate verifies mappings without mutating it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cors:
  # Comma-separated REST origins for /api/**; set explicit production origins.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

websocket:
  # Comma-separated STOMP /ws handshake origins; set explicit production origins.
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  jwt:
    # Local/test-only fallback. Production must set a random 32+ byte secret.
    secret: ${AUTH_JWT_SECRET:local-development-only-change-me-32-bytes-minimum!}
    issuer: ${AUTH_JWT_ISSUER:dsa-tracker}
    audience: ${AUTH_JWT_AUDIENCE:dsa-tracker-web}
    expiry: ${AUTH_JWT_EXPIRY:PT12H}
  google:
    # Public OAuth 2.0 Web client ID shared with the frontend build.
    client-id: ${GOOGLE_CLIENT_ID:}
  # Empty disables the operator-assisted legacy activation endpoint.
  legacy-setup-secret: ${LEGACY_ACCOUNT_SETUP_SECRET:}


catalog:
  questions-url: ${CATALOG_QUESTIONS_URL:https://raw.githubusercontent.com/SeanPrashad/leetcode-patterns/main/src/data/questions.json}
  roadmaps-url: ${CATALOG_ROADMAPS_URL:https://raw.githubusercontent.com/SeanPrashad/leetcode-patterns/main/src/data/roadmaps.ts}
  sync:
    # Monday at 03:00 UTC; startup sync also catches deployments or missed schedules.
    enabled: ${CATALOG_SYNC_ENABLED:true}
    cron: ${CATALOG_SYNC_CRON:0 0 3 * * MON}
    zone: ${CATALOG_SYNC_ZONE:UTC}

github:
  app:
    id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  poll:
    fixed-delay: ${GITHUB_EXPORT_POLL_FIXED_DELAY_MS:30000}
    batch-size: ${GITHUB_EXPORT_BATCH_SIZE:10}
    lease-duration: ${GITHUB_EXPORT_LEASE_DURATION:PT5M}
    retry-base: ${GITHUB_EXPORT_RETRY_BASE:PT1M}
    retry-max: ${GITHUB_EXPORT_RETRY_MAX:PT1H}
