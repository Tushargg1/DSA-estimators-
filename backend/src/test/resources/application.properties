# Test-only config.
# The real datasource is wired through application.yml and the local MySQL Compose service.
# Exclude DB auto-configuration so this smoke test can verify application wiring
# (including @EnableScheduling) without a running MySQL instance.
spring.application.name=backend
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
