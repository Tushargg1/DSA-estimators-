# Test-only config.
# The real datasource is wired up in task 1.3 (application.yml + docker-compose Postgres).
# Until then, exclude DB auto-configuration so the context-load smoke test can verify
# application wiring (including @EnableScheduling) without a running Postgres instance.
spring.application.name=backend
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
