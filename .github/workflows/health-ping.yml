name: Keep Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://dsa-estimators-1.onrender.com/api/health' }}
    steps:
      - name: Ping backend health endpoint
        run: >-
          curl --fail-with-body --silent --show-error --location
          --connect-timeout 10 --max-time 75 --retry 1 --retry-delay 10
          --retry-max-time 165 --retry-all-errors "$HEALTH_URL"
