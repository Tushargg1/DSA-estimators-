services:
  mysql:
    image: mysql:8.0.40
    container_name: dsa-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dsatracker}
      MYSQL_USER: ${MYSQL_USER:-dsatracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dsatracker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - dsa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dsa_mysql_data:
    name: dsa_tracker_mysql_data
