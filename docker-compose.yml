# This Compose file starts the local database only. When running the backend
# alongside it, set WEBSOCKET_ALLOWED_ORIGINS as documented in backend/.env.example.
services:
  postgres:
    image: postgres:16
    container_name: dsa-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsatracker}
      POSTGRES_USER: ${POSTGRES_USER:-dsatracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsatracker}
    ports:
      - "5432:5432"
    volumes:
      - dsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsatracker} -d ${POSTGRES_DB:-dsatracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dsa_pgdata:
    name: dsa_tracker_pgdata
